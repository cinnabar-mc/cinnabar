[package]
name = "world"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.cinnabar]
reads = ["tools/localserver/experience/testdata/go/cell_overlays.nbt"]

[features]
# Select Criterion lighting measurements instead of the allocation-counting CSV diagnostic.
runtime-profile = []
benchmark-mimalloc = ["runtime-profile"]

[dependencies]
block-transform = { path = "../block-transform" }
sha2.workspace = true
hashbrown = "0.16"
thiserror.workspace = true

[dev-dependencies]
mimalloc.workspace = true
test-alloc = { path = "../test-alloc" }
criterion.workspace = true
rayon.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "chunk_costs"
harness = false

[[bench]]
name = "light_work"
harness = false

[lints]
workspace = true
