[package]
name = "launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.cinnabar]
platform-specific = ["macos", "windows"]
reads = [
    "assets/startup-screen.json",
    "assets/branding/icon.png",
    "assets/branding/title.png",
    "core/authcache/derived_suffix.txt",
    "core/catalog/artwork_limit.txt",
    "core/catalog/profile_overview_limit.txt",
]

[features]
test-support = []

[dependencies]
cosmetics = { path = "../cosmetics" }
bridge = { path = "../bridge" }
json-ui = { path = "../json-ui" }
assets = { path = "../assets" }
render-api = { path = "../render-api" }
resource-pack = { path = "../resource-pack", default-features = false }
semantic-input = { path = "../input" }
ui = { path = "../ui" }
shaderpack = { path = "../shaderpack" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
update-manifest = { path = "../update-manifest" }
zip = { version = "7", default-features = false, features = ["deflate-flate2-zlib-rs"] }
thiserror.workspace = true

[lints]
workspace = true
