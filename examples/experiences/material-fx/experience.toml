id = "materialfx"
version = "0.2.0"
api = "0.11"
data-schema = 1

# The client part restyles the Experience's own entities and blocks with programmable world
# materials, and asks for the three world material effects for its effects wing; a client that
# grants only `render_world_material` shows the plain forms. Its textures are generated by
# `cargo run -p material-fx`, never committed.
[client]
permissions = [
    "messaging",
    "render_world_material",
    "render_world_material_vertex",
    "render_world_material_scene",
    "render_world_material_passes",
]
namespace = "materialfx"
textures = [
    "textures/noise.png",
    "textures/stars.png",
    "textures/diorama.png",
    "textures/painting.png",
    "textures/rune.png",
    "textures/skybox.png",
    "textures/lenticular.png",
]

# Server commands for the client part: an operation and four integer arguments. Positions are
# in thousandths of a block and times in milliseconds on the session clock (the wall clock
# modulo 4096 s). Each `# op <index> <name>: <meaning>` line below numbers one operation: the
# client part's build script derives its operation constants from them, and the local server's
# tests check its own against them.
# op 0 bind: bind every material
# op 1 unbind: unbind every material
# op 2 cut: wraith cut a/1000, or -1 to sweep
# op 3 boom: shockwave at (a, b), started at c
# op 4 heartbeat: heartbeat at boss health a/1000 from b, or a = -1 to stop
# op 5 hit: liquid metal hit at (a, b, c), started at d
# op 6 thermal: thermal vision on (a = 1) or off
# op 7 corrupt: corruption from (a, b, c), started at d, or d = -1 to cleanse
# op 8 layout: piece a (0 arena, 1 black hole, 2 painting, 3 screen, 4 portal, 5 flag cloth,
#   6 fire wall, 7 force field, 8 the grass field's top) centred at (b, c, d)
# op 9 facing: a quarter turns from south
# op 10 radar: player a at (b, c) of d players
# op 11 portal_distance: the player's distance to the portal, a, at b
# op 12 wind: wind a/1000
# op 13 jelly_hit: jelly hit at (a, b, c), started at d
# op 14 shatter: shatter burst started at a
# op 15 heat: heat haze a/1000
# op 16 refract: lens refraction a/1000
# op 17 pulse: force field pulse started at a
# op 18 outline: boss outline on (a = 1) or off
# op 19 bloom: bloom on (a = 1) or off
# op 20 storm: storm burst started at a
# op 21 fire: fire ignited at a, or a = -1 to put it out
[[client.channels]]
id = "materialfx.control"
schema = 3
direction = "to_client"
fields = [
    { type = "choice", variants = 22 },
    { type = "integer", min = -100000000, max = 100000000 },
    { type = "integer", min = -100000000, max = 100000000 },
    { type = "integer", min = -100000000, max = 100000000 },
    { type = "integer", min = -100000000, max = 100000000 },
]
