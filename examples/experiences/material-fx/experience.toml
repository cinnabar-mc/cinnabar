id = "materialfx"
version = "0.1.0"
api = "0.6"
data-schema = 1

# The client part restyles the Experience's own entities and blocks with programmable world
# materials. Its textures are generated by `cargo run -p material-fx`, never committed.
[client]
permissions = ["messaging", "render_world_material"]
namespace = "materialfx"
textures = ["textures/noise.png", "textures/stars.png"]

# Server commands for the client part: an operation and its value.
# 0 bind every material, 1 unbind every material (Bedrock looks), 2 damage flash of value/1000,
# 3 status colour `value` (0 none, 1 poison, 2 burning, 3 frozen), 4 dissolve cut of value/1000,
# or -1 to sweep.
[[client.channels]]
id = "materialfx.control"
schema = 1
direction = "to_client"
fields = [{ type = "choice", variants = 5 }, { type = "integer", min = -1, max = 1000 }]

# Filled by `cargo run -p material-fx`, because the hashes depend on the build.
[files]
